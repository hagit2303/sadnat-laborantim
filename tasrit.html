<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--navy:#22395B;--sky:#D3ECF8;--coral:#F26B4F;--sun:#F7C33C;--paper:#FFFDF8;--mut:#4F6B6A;--ca:#FDE7DC;--cb:#E2F0FA;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{direction:rtl;font-family:Rubik,Arial,sans-serif;color:var(--navy);background:var(--sky);background-image:radial-gradient(rgba(34,57,91,.1) 1.2px,transparent 1.4px);background-size:14px 14px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
header{text-align:center;display:flex;flex-direction:column;gap:4px}
header h1{font-weight:900;font-size:27px}
header p{font-size:14px;color:var(--mut)}
.box{background:var(--paper);border:3px solid var(--navy);border-radius:18px;box-shadow:5px 5px 0 var(--navy);padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{font-weight:900;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{font:inherit;font-weight:900;font-size:20px;padding:12px 0;border:3px solid var(--navy);border-radius:14px;background:#fff;color:var(--navy);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--sun);box-shadow:3px 3px 0 var(--navy)}
.scene{font-size:16px;line-height:1.55;background:var(--sky);border-radius:12px;padding:10px 12px}
.cast{display:flex;gap:8px;flex-wrap:wrap}
.cast span{font-weight:800;font-size:15px;border:2px solid var(--navy);border-radius:999px;padding:3px 12px}
.cast .a{background:var(--ca)}.cast .b{background:var(--cb)}
.chat{display:flex;flex-direction:column;gap:8px}
.ln{font-size:17px;line-height:1.5;border-radius:14px;padding:8px 12px;max-width:88%}
.ln b{font-weight:900;display:block;font-size:13px}
.ln.a{background:var(--ca);align-self:flex-start;border-bottom-right-radius:4px}
.ln.b{background:var(--cb);align-self:flex-end;border-bottom-left-radius:4px}
.ln.mine{background:var(--sun);border:2px solid var(--navy);font-weight:700}
.ln.cue{opacity:.65;font-size:15px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles .opt{font-size:15px}
ol{padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
ol li{font-size:16px;line-height:1.5}
.dir{font-size:14px;font-style:italic;color:var(--mut);text-align:center}
label{font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:4px}
textarea{font:inherit;font-size:16px;border:2px solid var(--navy);border-radius:10px;padding:8px;min-height:52px;resize:vertical;background:#fff;color:var(--navy)}
.foot{text-align:center;font-size:12px;color:var(--mut)}
</style>

 נשמה, יהיה בסדר! יש לי הרגשה שזו הולכת להיות בגרות מ-ו-ש-ל-מ-ת!"], ["a", "אני לא צריכה הרגשה. אני צריכה מספר. ותורידי בבקשה את הפרחים. את כולם. עכשיו."], ["*", "שירן אוספת 80 פרחים מנייר בתנופה אחת."], ["b", "בסדר!!! בשנה הבאה תקבלי בגרות בלי פרחים, בלי שמחה, ובלי לבורנטית! 💥"], ["a", "(רושמת בקלסר) מגש 1: פרח הוסר. נשארו 79."]]}, {"a": "שגיא, המורה", "b": "אורית, הלבורנטית", "scene": "בוקר יום הבגרות במעבדה. הלבורנטים הכינו מגש לכל תלמיד, בשלוש גרסאות: בעיה 1, בעיה 2 ובעיה 3. ההכנות לקחו שבועות. עכשיו, 40 דקות לפני הבחינה, המורה עובר/ת עם צ'קליסט על כל מגש: שהכול נמצא, ושהגרסאות מאוזנות בכל כיתה.", "lines": [["*", "שגיא נכנס בריצה, עם רמקול קטן ביד."], ["a", "בוקר טוב ללבורנטית הכי טובה בעולם!!! 🎉 יש לי רעיון גאוני: למה לחלק גרסאות לפי רשימה? שהתלמידים יגרילו! נעשה גלגל מזל! 🎡 ומוזיקה ברקע, שיירגעו!"], ["b", "בוקר טוב. הגרסאות מחולקות מראש. בכל כיתה יש מספר מאוזן של בעיה 1, 2 ו-3. יש לי טבלה."], ["a", "נו, אורית, איפה הכיף? הם כל כך לחוצים, מגיע להם קצת אקשן!"], ["b", "אם מגרילים, בכיתה אחת יכולות לצאת 12 בעיות 1 ושתי בעיות 3. ואז אין מספיק מגשים. וגם יש הנחיות."], ["a", "אז נכין עוד מגשים! מה הבעיה? יש עוד 40 דקות!"], ["b", "הכנת מגש אחד לוקחת שעה. את המגשים הכנו שלושה שבועות, לפי רשימת חומרים שקיבלנו מראש."], ["a", "וואו, איתך הכול טבלאות… תני לחיות קצת!"], ["b", "אני נותנת לחיות. אני רק לא משנה פרוטוקול 40 דקות לפני בגרות."], ["a", "(מכבה את הרמקול בכעס) את יודעת מה? בשנה הבאה אני מבקש לבורנטית עם דמיון! והמוזיקה נשארת אצלי! 💥"], ["b", "(פותחת את הטבלה) רשמתי."]]}, {"a": "יוסי, המורה", "b": "גלית, הלבורנטית", "scene": "בוקר יום הבגרות במעבדה. הלבורנטים הכינו מגש לכל תלמיד, בשלוש גרסאות: בעיה 1, בעיה 2 ובעיה 3. ההכנות לקחו שבועות. עכשיו, 40 דקות לפני הבחינה, המורה עובר/ת עם צ'קליסט על כל מגש: שהכול נמצא, ושהגרסאות מאוזנות בכל כיתה.", "lines": [["*", "יוסי נכנס לאט, עם שתי כוסות קפה."], ["a", "בוקר טוב, גלית 💛 הבאתי לך קפה… ישנת קצת? אני כל כך מעריך את כל מה שעשית…"], ["b", "תודה. יש לך 40 דקות. מה אתה צריך?"], ["a", "לא, כלום, באמת. רק… אם זה לא מסובך… יש לי תלמ
